# Test Configuration with In-Memory H2
spring.application.name=warehouse-risk-monitor-test
spring.profiles.active=test
spring.datasource.url=jdbc:h2:mem:warehouse_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

logging.level.com.warehouse.riskmonitor=WARN
logging.level.org.hibernate=ERROR

