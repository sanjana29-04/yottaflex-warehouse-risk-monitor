# Embedded H2 Database (Persistent file mode with MySQL compatibility)
spring.datasource.url=jdbc:h2:file:./data/h2/warehouse_db;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_UPPER=false;CACHE_SIZE=131072
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# HikariCP High-Throughput In-Memory Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

server.port=8085

